# Basin-YOLOv8n-seg-CA-WIoU: YOLOv8n-seg + Coordinate Attention + WIoU box loss
# Task: instance segmentation for calf feed basin/bucket opening.
# This YAML keeps the same CA model structure. WIoU is enabled in this branch through ultralytics/utils/wiou_patch.py.

# Parameters
nc: 80 # number of classes; training data.yaml will override this for custom datasets

# YOLOv8n-seg backbone with CoordAtt after SPPF
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C2f, [32, True]]
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C2f, [64, True]]
  - [-1, 1, Conv, [128, 3, 2]] # 5-P4/16
  - [-1, 2, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 7-P5/32
  - [-1, 1, C2f, [256, True]]
  - [-1, 1, SPPF, [256, 5]] # 9
  - [-1, 1, nn.CoordAtt, [256]] # 10 Coordinate Attention

# YOLOv8n-seg head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C2f, [128]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C2f, [64]] # 16 (P3/8-small)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 1, C2f, [128]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat CoordAtt-enhanced P5
  - [-1, 1, C2f, [256]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Segment, [nc, 32, 64]] # Segment(P3, P4, P5)
